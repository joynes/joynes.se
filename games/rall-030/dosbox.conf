[dosbox]
machine=svga_s3
memsize=32
[cpu]
core=normal
cputype=auto
cycles=25000
[mixer]
rate=44100
prebuffer=0
[midi]
mpu401=none
[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
oplmode=auto
[dos]
keyboardlayout=us
[autoexec]
@echo off
mount c .
c:
cd rall003
ALMOUSE.COM
CWSDPMI -p -x
rall.exe
exit
